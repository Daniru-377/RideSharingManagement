
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Bookings | RideX</title>

  <style>
    :root {
      --bg: #0e0e10;
      --card: #161618;
      --line: #2a2a2d;
      --tx: #f4f4f5;
      --mu: #9a9aa2;
      --red: #dc2626;
      --am: #f5b82e;
      --gr: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.5 Arial, sans-serif;
    }

    .pg {
      max-width: 1200px;
      margin: auto;
      padding: 0 24px 60px;
    }

    h1 {
      font-size: 2.8rem;
      text-transform: uppercase;
    }

    h1 span { color: #ff4545; }

    .sub { color: var(--mu); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      margin-top: 25px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 15px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    th { color: var(--mu); }

    .id {
      color: #ff4545;
      font-weight: bold;
    }

    .status {
      border: 1px solid currentColor;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: .8rem;
    }

    .wt { color: var(--am); }
    .ok { color: var(--gr); }
    .no { color: #f87171; }

    .btn, .b2 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 13px;
      border-radius: 7px;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    .btn {
      background: var(--red);
      color: white;
      border: 1px solid var(--red);
    }

    .b2 {
      background: transparent;
      color: white;
      border: 1px solid var(--line);
    }

    .acts {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: var(--mu);
    }

    .footer {
      text-align: center;
      color: var(--mu);
      margin-top: 30px;
    }

    @media(max-width:600px) {
      .pg { padding: 0 14px 40px; }
      .card { padding: 14px; }
    }
  </style>
</head>

<body>

<div class="pg">

  <div th:replace="~{fragments/layout :: navbar('bookings')}"></div>

  <h1>MY <span>BOOKINGS</span></h1>

  <p class="sub">
    View and manage your bike rental bookings.
  </p>

  <div style="margin-top:20px">

    <a th:href="@{/bookings/create}" class="btn">
      + New Booking
    </a>

  </div>

  <div class="card">

    <h2>My Booking Records</h2>

    <div class="table-wrap">

      <table>

        <thead>
        <tr>
          <th>Booking ID</th>
          <th>Bike Model</th>
          <th>Booking Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="b : ${bookings}">
          <td th:text="${b.bookingId}"></td>
          <td th:text="${b.bikeId}"></td>
          <td th:text="${b.bookingDate}"></td>
          <td th:text="${b.status}"></td>

          <td>
            <a th:href="@{/bookings/edit/{id}(id=${b.bookingId})}">
              Edit
            </a>

            <form th:action="@{/bookings/delete/{id}(id=${b.bookingId})}"
                  method="post"
                  style="display:inline;">
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(bookings)}">

          <td colspan="5" class="empty">
            You have no bookings yet.
          </td>

        </tr>

        </tbody>

      </table>

    </div>

  </div>

  <div class="footer">
    © 2026 RIDEX | Bike Rental Management System
  </div>

</div>

</body>
</html>
