<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
    <style>
        :root{--bg:#0e0e10;--card:#161618;--line:#2a2a2d;--tx:#f4f4f5;--mu:#9a9aa2;--red:#dc2626;--gr:#34d399}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,sans-serif}
        .container{max-width:600px;margin:60px auto;padding:0 24px;text-align:center;}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px}
        h2{color:var(--gr);margin-top:10px;font-size:2rem}
        .info{text-align:left;margin-top:20px;border-top:1px solid var(--line);padding-top:20px;}
        .info-row{display:flex;justify-content:space-between;padding:8px 0;}
        .label{color:var(--mu)}
        .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:8px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--red);background:var(--red);color:#fff;margin-top:30px;width:100%}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Payment Successful!</h2>
        <p style="color: var(--mu);">Your payment has been processed successfully.</p>

        <div class="info" th:object="${payment}">
            <div class="info-row"><span class="label">Payment ID:</span> <strong th:text="*{paymentId}">P001</strong></div>
            <div class="info-row"><span class="label">Booking ID:</span> <span th:text="*{bookingId}">B001</span></div>
            <div class="info-row"><span class="label">Amount:</span> <span th:text="'Rs. ' + *{amount}">Rs. 5000.0</span></div>
            <div class="info-row"><span class="label">Method:</span> <span th:text="*{method}">Card</span></div>
            <div class="info-row"><span class="label">Status:</span> <span style="color:var(--gr)" th:text="*{status}">Paid</span></div>
            <div class="info-row"><span class="label">Date:</span> <span th:text="*{paymentDate}">2026-06-06</span></div>
        </div>

        <a th:href="@{/payments}" class="btn">View All Payments</a>
    </div>
</div>

</body>
</html>
