<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Payments</title>
    <style>
        :root{--bg:#0e0e10;--card:#161618;--line:#2a2a2d;--tx:#f4f4f5;--mu:#9a9aa2;--red:#dc2626;--red2:#b91c1c;--gr:#34d399}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,sans-serif}
        .container{max-width:1200px;margin:40px auto;padding:0 24px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
        h2{margin-top:0;font-size:1.75rem;font-weight:800}
        table{width:100%;border-collapse:collapse;margin-top:20px}
        th{color:var(--mu);font-weight:400;text-align:left;padding:12px;border-bottom:1px solid var(--line)}
        td{padding:14px 12px;border-bottom:1px solid var(--line);font-size:0.95rem}
        tr:last-child td{border-bottom:0}
        .b2{padding:6px 12px;border-radius:6px;font-size:0.85rem;font-weight:500;text-decoration:none;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--tx)}
        .b2:hover{background:#1d1d20}
        .btn-danger{border-color:var(--red);color:#f87171}
        .btn-danger:hover{background:rgba(220,38,38,.15)}
        select{padding:6px;background:#0b0b0c;color:var(--tx);border:1px solid var(--line);border-radius:6px;}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Payment Records List</h2>

        <div th:if="${payments.empty}" style="color: var(--mu); padding: 20px 0;">
            No payment records found.
        </div>

        <table th:if="${!payments.empty}">
            <thead>
            <tr>
                <th>Payment ID</th>
                <th>Booking ID</th>
                <th>User ID</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${payments}">
                <td th:text="${p.paymentId}" style="font-weight: 600;">P001</td>
                <td th:text="${p.bookingId}">B001</td>
                <td th:text="${p.userId}">U001</td>
                <td th:text="'Rs. ' + ${p.amount}">Rs. 5000</td>
                <td th:text="${p.method}">Card</td>
                <td>
                    <form th:action="@{/payments/update}" method="post" style="display:inline;">
                        <input type="hidden" name="paymentId" th:value="${p.paymentId}" />
                        <select name="status" onchange="this.form.submit()">
                            <option value="Paid" th:selected="${p.status == 'Paid'}">Paid</option>
                            <option value="Pending" th:selected="${p.status == 'Pending'}">Pending</option>
                        </select>
                    </form>
                </td>
                <td th:text="${p.paymentDate}" style="color: var(--mu);">2026-06-06</td>
                <td>
                    <form th:action="@{/payments/delete/{id}(id=${p.paymentId})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this payment?');">
                        <button type="submit" class="b2 btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
